# .github/workflows/daily_checkin.yml
name: 每日签到 - 可扩展为多账户

on:
  schedule:
    # UTC 每日 00:30，折合北京时间 08:30
    - cron: '30 0 * * *'
  workflow_dispatch:  # 允许你手动点 Run workflow

jobs:
  sign:
    runs-on: ubuntu-latest

    ### 多账户支持
    # 在 Settings → Environments 里为每个账号建一个同名的 Environment，
    # 并在其中各自填写该账号的 COOKIES / CAPTCHA_KEY / PASSWORD Secret。
    # 想加/减账号，只改下面 env 列表里的名字即可。
    strategy:
      # 一个账号失败不影响其它账号继续签到
      fail-fast: false
      matrix:
        env: [acc1, acc2]  # 有几个账号就写几个 Environment 名，例如再加 acc3

    # 动态切换到 matrix.env 对应的 Environment，读取该账号的 Secret
    environment: ${{ matrix.env }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成 config.toml
        run: |
          cat > config.toml <<EOF
          cookie = "${{ secrets.COOKIES }}"
          captcha_key = "${{ secrets.CAPTCHA_KEY }}"
          username = "${{ env.USERNAME }}"
          password = "${{ secrets.PASSWORD }}"
          timeout  = 20
          min_wait = 1.0
          max_wait = 3.0
          EOF

      - name: 执行签到脚本
        run: |
          sleep $((RANDOM % 300))  # 随机延迟 0～300 秒
          python -m scripts.run_sign

      - name: 执行每日答题脚本
        # 答题为尽力而为：题库没收录的新题会被跳过，不影响签到结果
        continue-on-error: true
        run: python -m scripts.run_quiz
